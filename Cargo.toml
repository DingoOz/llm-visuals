[package]
name = "llm-visuals"
version = "0.9.0"
edition = "2021"
description = "Live terminal dashboard for a locally running LLM: throughput, GPUs, context, MTP acceptance, layer and expert activity"
license = "MIT"
repository = "https://github.com/DingoOz/llm-visuals"
readme = "README.md"
keywords = ["llm", "tui", "llama-cpp", "gpu", "monitoring"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
chrono = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# No /proc outside Linux: process list, argv and per-process I/O come from here.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# Distributed binaries: one codegen unit and cross-crate inlining, with the
# debug symbols dropped. Unwinding stays on because the guard that leaves the
# alternate screen restores the terminal from Drop, which a panic=abort build
# would never run.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
